server:
  port: 8088

spring:
  application:
    name: selection-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:selection;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      encoding: UTF-8

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  info:
    env:
      enabled: false
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

selection:
  metadata:
    version: 0.0.1-SNAPSHOT
    release-date: 2026-06-04
    sample-data-version: 2026-06-04
  market-data:
    mode: jdbc-only
    external:
      enabled: false
      base-url: ""
      api-key: ""
      trends-path: /market/trends
      competition-path: /market/competition
      supply-path: /market/supply-demand
  open-api:
    key: selection-open-demo
  push:
    simulate-delivery: true
